name: Update contribution snake

on:
  workflow_dispatch:
  schedule:
    # Refresh throughout the day; GitHub may delay scheduled runs.
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-snake.yml'
      - 'README.md'

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate light and dark contribution animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          # GitHub includes anonymous private activity when Private contributions is enabled.
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Slow down the animation slightly
        run: |
          python3 - <<'PY'
          import re
          from decimal import Decimal
          from pathlib import Path

          # Keep the snake, contribution cells, and progress bar synchronized.
          duration = re.compile(r"(\banimation:[^;{}]*?)(\d+(?:\.\d+)?)ms\b")
          for name in ("github-contribution-grid-snake.svg", "github-contribution-grid-snake-dark.svg"):
              path = Path("dist") / name
              svg, count = duration.subn(
                  lambda match: match[1] + format(Decimal(match[2]) * Decimal("1.35"), "f") + "ms",
                  path.read_text(),
              )
              if not count:
                  raise RuntimeError(f"No animation duration found in {name}")
              path.write_text(svg)
          PY

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          commit_message: 'chore: update contribution snake'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
